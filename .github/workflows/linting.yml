name: Linting
on: [push]
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.5
            - name: Checkout code
              uses: actions/checkout@v6
            - name: Install PHP dependencies
              run: composer install --no-interaction --no-progress --no-scripts
            - name: Run PHP CodeSniffer
              run: composer lint
